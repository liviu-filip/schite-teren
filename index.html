<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Schițe teren</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1f4e79">
<style>
  :root { --bara:#1f4e79; --activ:#f0a020; }
  [hidden] { display:none !important; }
  input, textarea { -webkit-user-select:text; user-select:text; touch-action:manipulation; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#fff; font-family:system-ui,Roboto,sans-serif; }
  #bara { position:fixed; top:0; left:0; right:0; height:60px; background:var(--bara); display:flex; align-items:center; gap:6px; padding:0 8px; overflow-x:auto; }
  #bara button { flex:none; height:46px; min-width:46px; padding:0 14px; border:0; border-radius:8px; background:#2f6aa3; color:#fff; font-size:17px; }
  #bara button.activ { background:var(--activ); color:#000; font-weight:600; }
  #bara button.mic { padding:0 10px; font-size:20px; }
  #bara .sep { flex:none; width:1px; height:36px; background:#ffffff55; margin:0 4px; }
  #titlu { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:transparent !important; text-decoration:underline dotted; }
  #c { position:fixed; top:60px; left:0; width:100vw; height:calc(100vh - 60px); touch-action:none; display:block; }
  #actiuni { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; background:#fff; padding:8px; border-radius:12px; box-shadow:0 2px 12px #0004; }
  #actiuni button { height:48px; padding:0 18px; font-size:17px; border:0; border-radius:8px; background:#e8eef5; }
  #actiuni button.rosu { background:#c62828; color:#fff; }
  #modal { position:fixed; inset:0; background:#0006; display:flex; align-items:center; justify-content:center; z-index:10; }
  #modal .cutie { background:#fff; border-radius:12px; padding:20px; width:min(520px,92vw); max-height:86vh; overflow:auto; }
  #modal h3 { margin:0 0 12px; font-size:19px; }
  #modal input { width:100%; font-size:22px; padding:10px; border:1px solid #999; border-radius:8px; -webkit-user-select:text; user-select:text; }
  #modal .tastatura { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  #modal .tastatura button { height:64px; font-size:26px; border:0; border-radius:10px; background:#e8eef5; }
  #modal .tastatura button.alt { background:#d5dde6; }
  #modal .butoane { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; flex-wrap:wrap; }
  #modal .butoane button, #modal .lista button { height:48px; padding:0 18px; font-size:17px; border:0; border-radius:8px; background:#e8eef5; }
  #modal .butoane button.ok { background:var(--bara); color:#fff; }
  #modal .lista { display:flex; flex-direction:column; gap:8px; }
  #modal .rand { display:flex; gap:8px; align-items:center; }
  #modal .rand .nume { flex:1; text-align:left; background:#f4f7fa !important; }
  #modal .rand .nume small { color:#666; display:block; font-size:13px; }
  #modal .rand .sterge { background:#fbe9e7 !important; color:#c62828; }
  #toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:20px; font-size:16px; z-index:20; pointer-events:none; }
</style>
</head>
<body>
<div id="bara">
  <button id="btnSchite" class="mic" title="Schițele">☰</button>
  <button id="titlu" title="Redenumește">Schiță</button>
  <span class="sep"></span>
  <button data-unealta="perete" class="activ">Perete</button>
  <button data-unealta="usa">Ușă</button>
  <button data-unealta="geam">Geam</button>
  <button data-unealta="cota">Cotă</button>
  <button data-unealta="radiera">Radieră</button>
  <button data-unealta="selectie">Selectează</button>
  <span class="sep"></span>
  <button id="btnOrto">90° DA</button>
  <button id="btnUndo" class="mic" title="Anulează">↶</button>
  <button id="btnRedo" class="mic" title="Refă">↷</button>
  <button id="btnFit" class="mic" title="Toată schița pe ecran">⤢</button>
  <span class="sep"></span>
  <button id="btnPoze">📷 Poze</button>
  <button id="btnExport">Trimite</button>
</div>
<canvas id="c"></canvas>
<div id="actiuni" hidden>
  <button id="aDim">Dimensiune</button>
  <button id="aIntoarce">Întoarce ușa</button>
  <button id="aSterge" class="rosu">Șterge</button>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const CHEIE = 'schite_v1';
let dpr = 1;
let schita = null;
let view = { s: 1, ox: 40, oy: 40 };
let unealta = 'perete', orto = true, sel = null;
let istoric = [], viitor = [];
let penVazut = false;
let act = null;            // acțiunea de desen în curs
const degete = new Map();  // atingerile de navigare (pan / zoom)
let nav = null;

/* ---------- memorare pe tabletă ---------- */
function uid() { return Math.random().toString(36).slice(2, 9); }
function acum() { return new Date().toISOString(); }
function citesteToate() { try { return JSON.parse(localStorage.getItem(CHEIE)) || {}; } catch (e) { return {}; } }
function scrieToate(t) { try { localStorage.setItem(CHEIE, JSON.stringify(t)); return true; } catch (e) { toast('Nu pot salva pe tabletă!'); return false; } }
function salveaza() {
  schita.modificat = acum();
  const t = citesteToate(); t[schita.id] = schita; scrieToate(t);
  try { localStorage.setItem(CHEIE + '_ultima', schita.id); } catch (e) {}
}
function nouaSchita(nume) { return { id: uid(), nume: nume || 'Schiță fără nume', creat: acum(), modificat: acum(), pereti: [], deschideri: [], cote: [] }; }
function deschide(s) {
  schita = s; istoric = []; viitor = []; sel = null; act = null;
  $('#titlu').textContent = schita.nume;
  salveaza(); actualizeazaActiuni(); potriveste();
}
function modifica(fn) {
  istoric.push(JSON.stringify(schita)); if (istoric.length > 300) istoric.shift();
  viitor = []; fn(); salveaza(); actualizeazaActiuni(); deseneaza();
}
function undo() { if (!istoric.length) return; viitor.push(JSON.stringify(schita)); schita = JSON.parse(istoric.pop()); sel = null; salveaza(); actualizeazaActiuni(); deseneaza(); }
function redo() { if (!viitor.length) return; istoric.push(JSON.stringify(schita)); schita = JSON.parse(viitor.pop()); sel = null; salveaza(); actualizeazaActiuni(); deseneaza(); }

/* ---------- geometrie ---------- */
const lume = (sx, sy) => ({ x: (sx - view.ox) / view.s, y: (sy - view.oy) / view.s });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function proiectie(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy;
  let t = L2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  const q = { x: a.x + t * dx, y: a.y + t * dy };
  return { t, q, d: dist(p, q) };
}
const A = w => ({ x: w.x1, y: w.y1 }), B = w => ({ x: w.x2, y: w.y2 });
const perete = id => schita.pereti.find(w => w.id === id);
const punctPe = (w, t) => ({ x: w.x1 + (w.x2 - w.x1) * t, y: w.y1 + (w.y2 - w.y1) * t });
function capete() {
  const r = [];
  for (const w of schita.pereti) r.push(A(w), B(w));
  for (const c of schita.cote) r.push(A(c), B(c));
  return r;
}
function lipesteCapat(p, tol) {
  let best = null, bd = tol;
  for (const q of capete()) { const d = dist(p, q); if (d < bd) { bd = d; best = q; } }
  return best ? { x: best.x, y: best.y } : null;
}
function lipestePerete(p, tol) {
  let best = null, bd = tol;
  for (const w of schita.pereti) { const r = proiectie(p, A(w), B(w)); if (r.d < bd) { bd = r.d; best = r.q; } }
  return best;
}
function punctStart(p) {
  const tol = 18 / view.s;
  return lipesteCapat(p, tol) || lipestePerete(p, tol) || { x: p.x, y: p.y };
}
function punctFinal(start, p) {
  const tol = 18 / view.s;
  const c = lipesteCapat(p, tol); if (c) return c;
  const q = { x: p.x, y: p.y };
  if (orto) {
    const ang = Math.abs(Math.atan2(q.y - start.y, q.x - start.x)) * 180 / Math.PI;
    let oriz = false, vert = false;
    if (ang < 12 || ang > 168) { q.y = start.y; oriz = true; }
    else if (Math.abs(ang - 90) < 12) { q.x = start.x; vert = true; }
    if (oriz || vert) {
      for (const e of capete()) {
        if (oriz && Math.abs(e.x - q.x) < tol) { q.x = e.x; return q; }
        if (vert && Math.abs(e.y - q.y) < tol) { q.y = e.y; return q; }
      }
      return q;
    }
  }
  return lipestePerete(q, tol) || q;
}
function gasesteLa(p, tolPx) {
  const tol = (tolPx || 16) / view.s;
  for (const c of schita.cote) if (proiectie(p, A(c), B(c)).d < tol) return { tip: 'cota', id: c.id };
  for (const o of schita.deschideri) {
    const w = perete(o.perete); if (!w) continue;
    if (proiectie(p, punctPe(w, o.a), punctPe(w, o.b)).d < tol) return { tip: 'deschidere', id: o.id };
  }
  for (const w of schita.pereti) if (proiectie(p, A(w), B(w)).d < tol) return { tip: 'perete', id: w.id };
  return null;
}
function element(s) {
  if (!s) return null;
  const lista = s.tip === 'cota' ? schita.cote : s.tip === 'deschidere' ? schita.deschideri : schita.pereti;
  return lista.find(e => e.id === s.id) || null;
}

/* ---------- desen ---------- */
function redimensioneaza() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cv.clientWidth * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  deseneaza();
}
function grila() {
  const pas = 20;
  if (pas * view.s < 7) return;
  const a = lume(0, 0), b = lume(cv.clientWidth, cv.clientHeight);
  ctx.beginPath();
  for (let x = Math.floor(a.x / pas) * pas; x <= b.x; x += pas) { ctx.moveTo(x, a.y); ctx.lineTo(x, b.y); }
  for (let y = Math.floor(a.y / pas) * pas; y <= b.y; y += pas) { ctx.moveTo(a.x, y); ctx.lineTo(b.x, y); }
  ctx.strokeStyle = '#e9eef3'; ctx.lineWidth = 1 / view.s; ctx.stroke();
}
function linie(g, a, b) { g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
function textPeLinie(g, a, b, txt, px, culoare, dedesubt) {
  if (!txt) return;
  let ang = Math.atan2(b.y - a.y, b.x - a.x);
  if (ang > Math.PI / 2 || ang <= -Math.PI / 2) ang += Math.PI;
  g.save();
  g.translate((a.x + b.x) / 2, (a.y + b.y) / 2); g.rotate(ang);
  g.font = (15 * px) + 'px system-ui,sans-serif'; g.textAlign = 'center';
  const y = dedesubt ? 18 * px : -6 * px;
  const w = g.measureText(txt).width;
  g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(-w / 2 - 3 * px, y - 14 * px, w + 6 * px, 18 * px);
  g.fillStyle = culoare; g.fillText(txt, 0, y);
  g.restore();
}
function deseneazaSchita(g, s, opt) {
  const px = 1 / s;
  g.lineCap = 'round'; g.lineJoin = 'round';
  // selecția, dedesubt
  if (opt.sel) {
    const e = element(opt.sel);
    g.strokeStyle = '#f0a02099'; g.lineWidth = 16 * px;
    if (e && opt.sel.tip === 'deschidere') { const w = perete(e.perete); if (w) linie(g, punctPe(w, e.a), punctPe(w, e.b)); }
    else if (e) linie(g, A(e), B(e));
  }
  // pereții
  g.strokeStyle = '#111'; g.lineWidth = 5 * px;
  for (const w of schita.pereti) linie(g, A(w), B(w));
  // ușile și geamurile
  for (const o of schita.deschideri) {
    const w = perete(o.perete); if (!w) continue;
    const a = punctPe(w, o.a), b = punctPe(w, o.b), L = dist(a, b); if (L <= 0) continue;
    const u = { x: (b.x - a.x) / L, y: (b.y - a.y) / L }, n = { x: -u.y, y: u.x };
    g.lineCap = 'butt';
    g.strokeStyle = '#fff'; g.lineWidth = (o.tip === 'geam' ? 7 : 9) * px; linie(g, a, b);
    const cul = o.tip === 'geam' ? '#1565c0' : '#b23c17';
    g.strokeStyle = cul; g.lineWidth = 2 * px;
    const cap = o.tip === 'geam' ? 3.5 : 5;
    for (const p of [a, b]) linie(g, { x: p.x - n.x * cap * px, y: p.y - n.y * cap * px }, { x: p.x + n.x * cap * px, y: p.y + n.y * cap * px });
    let laturaText = false;
    if (o.tip === 'geam') {
      for (const k of [-2, 0, 2]) linie(g, { x: a.x + n.x * k * px, y: a.y + n.y * k * px }, { x: b.x + n.x * k * px, y: b.y + n.y * k * px });
    } else {
      const f = o.deschidere || 0, v = o.varianta || 'simpla', sg = (f & 2) ? -1 : 1;
      const canat = (bal, d, Lc) => {            /* canat cu balamaua în bal, închis spre d (vector unitate), lungime Lc */
        const cap = { x: bal.x + n.x * sg * Lc, y: bal.y + n.y * sg * Lc };
        g.strokeStyle = cul; g.lineWidth = 2 * px; linie(g, bal, cap);
        if (v === 'sticla') {
          g.strokeStyle = '#1565c0'; g.lineWidth = 4 * px;
          linie(g, { x: bal.x + (cap.x - bal.x) * .2, y: bal.y + (cap.y - bal.y) * .2 }, { x: bal.x + (cap.x - bal.x) * .8, y: bal.y + (cap.y - bal.y) * .8 });
        }
        const a1 = Math.atan2(cap.y - bal.y, cap.x - bal.x), a2 = Math.atan2(d.y, d.x);
        let dd = a2 - a1; while (dd > Math.PI) dd -= 2 * Math.PI; while (dd < -Math.PI) dd += 2 * Math.PI;
        g.strokeStyle = cul; g.lineWidth = 1.2 * px; g.setLineDash([6 * px, 4 * px]);
        g.beginPath(); g.arc(bal.x, bal.y, Lc, a1, a2, dd < 0); g.stroke(); g.setLineDash([]);
      };
      if (v === 'dubla') { canat(a, u, L / 2); canat(b, { x: -u.x, y: -u.y }, L / 2); }
      else if (v === 'glisanta') {
        const dir = (f & 1) ? 1 : -1, off = 7 * px * sg;
        const P = (q, k, m2) => ({ x: q.x + n.x * off * k + u.x * m2, y: q.y + n.y * off * k + u.y * m2 });
        g.strokeStyle = cul; g.lineWidth = 2 * px; linie(g, P(a, 1, 0), P(b, 1, 0));
        g.setLineDash([6 * px, 4 * px]); linie(g, P(a, 2, dir * L * .5), P(b, 2, dir * L * .5)); g.setLineDash([]);
        const c0 = P(a, 3, L * .5), c1 = P(a, 3, L * .5 + dir * L * .5);
        linie(g, c0, c1);
        linie(g, c1, { x: c1.x - dir * u.x * 7 * px + n.x * 4 * px, y: c1.y - dir * u.y * 7 * px + n.y * 4 * px });
        linie(g, c1, { x: c1.x - dir * u.x * 7 * px - n.x * 4 * px, y: c1.y - dir * u.y * 7 * px - n.y * 4 * px });
      }
      else { const bal = (f & 1) ? b : a, d = (f & 1) ? { x: -u.x, y: -u.y } : u; canat(bal, d, L); }
      laturaText = sg > 0;   // textul pe partea opusă deschiderii ușii (aproximativ)
    }
    g.lineCap = 'round';
    const et = (o.tip === 'geam' ? 'G' + (o.dim ? ' ' + o.dim : '') : (o.varianta === 'sticla' && o.dim ? o.dim : ''));
    if (et) textPeLinie(g, a, b, et, px, cul, o.tip === 'usa' ? !laturaText : false);
  }
  // cotele
  for (const c of schita.cote) {
    const a = A(c), b = B(c), L = dist(a, b); if (L <= 0) continue;
    const u = { x: (b.x - a.x) / L, y: (b.y - a.y) / L }, n = { x: -u.y, y: u.x };
    g.strokeStyle = '#2e7d32'; g.lineWidth = 1.5 * px;
    linie(g, a, b);
    for (const p of [a, b]) {
      linie(g, { x: p.x - n.x * 8 * px, y: p.y - n.y * 8 * px }, { x: p.x + n.x * 8 * px, y: p.y + n.y * 8 * px });
      linie(g, { x: p.x - (u.x + n.x) * 4 * px, y: p.y - (u.y + n.y) * 4 * px }, { x: p.x + (u.x + n.x) * 4 * px, y: p.y + (u.y + n.y) * 4 * px });
    }
    textPeLinie(g, a, b, c.val, px, '#2e7d32', false);
  }
  // desenul în curs
  if (opt.act) {
    const k = opt.act;
    g.setLineDash([8 * px, 6 * px]);
    if (k.unealta === 'perete' && k.cur) { g.strokeStyle = '#111'; g.lineWidth = 5 * px; linie(g, k.start, k.cur); }
    if (k.unealta === 'cota' && k.cur) { g.strokeStyle = '#2e7d32'; g.lineWidth = 2 * px; linie(g, k.start, k.cur); }
    if ((k.unealta === 'usa' || k.unealta === 'geam') && k.perete) {
      const w = perete(k.perete);
      if (w) { g.strokeStyle = k.unealta === 'geam' ? '#1565c0' : '#b23c17'; g.lineWidth = 10 * px; linie(g, punctPe(w, Math.min(k.t0, k.t1)), punctPe(w, Math.max(k.t0, k.t1))); }
    }
    g.setLineDash([]);
    if (k.cur && (k.unealta === 'perete' || k.unealta === 'cota')) {
      g.fillStyle = '#f0a020'; g.beginPath(); g.arc(k.cur.x, k.cur.y, 6 * px, 0, 7); g.fill();
    }
  }
}
function deseneaza() {
  if (!schita) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.ox, dpr * view.oy);
  grila();
  deseneazaSchita(ctx, view.s, { sel, act });
}
function limite() {
  const p = capete();
  for (const o of schita.deschideri) {
    const w = perete(o.perete); if (!w) continue;
    const a = punctPe(w, o.a), b = punctPe(w, o.b), L = dist(a, b);
    p.push({ x: a.x - L, y: a.y - L }, { x: a.x + L, y: a.y + L });
  }
  if (!p.length) return null;
  return { x0: Math.min(...p.map(q => q.x)), y0: Math.min(...p.map(q => q.y)), x1: Math.max(...p.map(q => q.x)), y1: Math.max(...p.map(q => q.y)) };
}
function potriveste() {
  const b = limite();
  if (!b) { view = { s: 1, ox: 40, oy: 40 }; deseneaza(); return; }
  const W = cv.clientWidth, H = cv.clientHeight, m = 60;
  const s = Math.min((W - 2 * m) / Math.max(b.x1 - b.x0, 1), (H - 2 * m) / Math.max(b.y1 - b.y0, 1), 4);
  view = { s, ox: (W - (b.x1 - b.x0) * s) / 2 - b.x0 * s, oy: (H - (b.y1 - b.y0) * s) / 2 - b.y0 * s };
  deseneaza();
}

/* ---------- atingeri: creion = desen, degete = mutare / zoom ---------- */
function pozitie(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function startNav() {
  const v = [...degete.values()];
  if (v.length === 1) nav = { c: v[0], d: 0 };
  else if (v.length >= 2) nav = { c: { x: (v[0].x + v[1].x) / 2, y: (v[0].y + v[1].y) / 2 }, d: dist(v[0], v[1]) };
  else nav = null;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'pen') penVazut = true;
  cv.setPointerCapture(e.pointerId);
  const p = pozitie(e);
  const deget = e.pointerType === 'touch';
  if (deget && (penVazut || degete.size >= 1 || (act && act.pid !== e.pointerId))) {
    if (act && act.deget) { act = null; }   // al doilea deget anulează desenul început cu degetul
    degete.set(e.pointerId, p); startNav(); deseneaza(); return;
  }
  if (deget) degete.set(e.pointerId, p);
  if (e.button === 1 || e.button === 2) { degete.set(e.pointerId, p); startNav(); return; }
  incepeActiune(e.pointerId, lume(p.x, p.y), deget);
});
cv.addEventListener('pointermove', e => {
  const p = pozitie(e);
  if (degete.has(e.pointerId) && (!act || act.pid !== e.pointerId)) {
    degete.set(e.pointerId, p);
    const v = [...degete.values()];

}
const pozeAdauga = p => pozeOp('readwrite', st => st.put(p));
const pozeSterge = id => pozeOp('readwrite', st => st.delete(id));
async function pozeSchita(id) {
  try { return ((await pozeOp('readonly', st => st.getAll())) || []).filter(p => p.schita === id).sort((a, b) => a.creat.localeCompare(b.creat)); }
  catch (e) { return []; }
}
async function micsoreaza(fisier, max) {
  let bmp;
  try { bmp = await createImageBitmap(fisier, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(fisier); }); }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight, f = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * f); c.height = Math.round(h0 * f);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}
function faPoza() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try {
      const blob = await micsoreaza(f, 1600), d = new Date(), z = n => String(n).padStart(2, '0');
      const n = 'poza_' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds());
      await pozeAdauga({ id: schita.id + ':' + uid(), schita: schita.id, nume: n, creat: acum(), blob });
      toast('Poză salvată');
    } catch (e) { toast('Nu am putut salva poza'); }
    arataPoze();
  };
  inp.click();
}
async function arataPoze() {
  const m = $('#modal'), poze = await pozeSchita(schita.id);
  m.innerHTML = '<div class="cutie"><h3></h3><div class="lista tipuri"></div><div class="lista pozele" style="margin-top:14px"></div><div class="butoane"><button class="nu">Închide</button></div></div>';
  m.querySelector('h3').textContent = 'Poze pentru „' + schita.nume + '” (' + poze.length + ')';
  const fa = document.createElement('button'); fa.textContent = '📷 Fă o poză'; fa.style.height = '64px'; fa.style.fontSize = '20px';
  fa.onclick = faPoza; m.querySelector('.tipuri').append(fa);
  const mb = document.createElement('button'); mb.textContent = '✍ Mandat (semnează clientul)'; mb.style.height = '64px'; mb.style.fontSize = '20px';
  mb.onclick = () => arataMandat(); m.querySelector('.tipuri').append(mb);
  const l = m.querySelector('.pozele');
  const urls = [];
  for (const q of poze) {
    const r = document.createElement('div'); r.className = 'rand';
    const im = document.createElement('img'); const u = URL.createObjectURL(q.blob); urls.push(u); if (!q.ext || q.ext === '.png' || q.ext === '.jpg') im.src = u;
    im.style.cssText = 'height:56px;width:76px;object-fit:cover;border-radius:6px;background:#eee';
    const b = document.createElement('button'); b.className = 'nume'; b.innerHTML = '<span></span><small></small>';
    b.querySelector('span').textContent = q.nume + (q.ext || '.jpg'); b.querySelector('small').textContent = dataScurta(q.creat) + ' · ' + Math.round(q.blob.size / 1024) + ' KB';
    b.onclick = () => { if (!q.ext || q.ext === '.png') window.open(u, '_blank'); };
    const x = document.createElement('button'); x.className = 'sterge'; x.textContent = 'Șterge';
    x.onclick = async () => { urls.forEach(URL.revokeObjectURL); await pozeSterge(q.id); arataPoze(); };
    r.append(im, b, x); l.append(r);
  }
  m.querySelector('.nu').onclick = () => { urls.forEach(URL.revokeObjectURL); m.hidden = true; m.innerHTML = ''; };
  m.hidden = false;
}
$('#btnPoze').addEventListener('click', arataPoze);

/* ---------- mandat: clientul scrie numele și localitatea (scrisul de mână se transformă în text) și semnează pe pagină ---------- */
/* Pe tabletă se salvează doar datele și semnătura (mandat_date.json + semnatura.png); mandatul PDF îl face PC-ul (mandat_din_tableta.py). */
function citesteMandatar() { try { return JSON.parse(localStorage.getItem('schite_mandatar')); } catch (e) { return null; } }
async function datePozaText(id) {
  try { const r = (await pozeSchita(schita.id)).find(x => x.id === id); return r ? JSON.parse(await r.blob.text()) : null; } catch (e) { return null; }
}
async function arataMandat() {
  const m = $('#modal'), mand = citesteMandatar();
  if (!mand || !mand.nume) {                      /* o singură dată, pe tabletă: datele mandatarului (nu stau în codul public) */
    const nume = await intreaba('Mandatar: nume (o singură dată)', '', 'text'); if (!nume || !nume.trim()) { arataPoze(); return; }
    const loc = await intreaba('Mandatar: localitatea de domiciliu', '', 'text'); if (loc === null) { arataPoze(); return; }
    const firma = await intreaba('Mandatar: firma (din cadrul …)', '', 'text'); if (firma === null) { arataPoze(); return; }
    try { localStorage.setItem('schite_mandatar', JSON.stringify({ nume: nume.trim().toUpperCase(), localitate: loc.trim().toUpperCase(), firma: firma.trim().toUpperCase() })); } catch (e) {}
    return arataMandat();
  }
  const vechi = await datePozaText(schita.id + ':mandat');
  let sex = vechi && vechi.solicitant ? vechi.solicitant.sex : '', desenat = false;
  m.innerHTML = '<div class="cutie"><h3>Mandat</h3>' +
    '<label>Numele (NUME PRENUME)</label><input id="mNume" autocomplete="off">' +
    '<label style="display:block;margin-top:10px">Localitatea de domiciliu</label><input id="mLoc" autocomplete="off">' +
    '<div class="butoane" style="justify-content:flex-start"><button id="mM">Domnul (M)</button><button id="mF">Doamna (F)</button></div>' +
    '<div id="mText" style="margin:12px 0;font-size:15px;line-height:1.45;text-align:justify"></div>' +
    '<div style="font-weight:600">MANDANT — semnătura</div>' +
    '<canvas id="mSemn" style="width:100%;height:170px;border:1px solid #999;border-bottom:3px solid #333;border-radius:6px;background:#fff;touch-action:none;display:block"></canvas>' +
    '<div class="butoane"><button id="mSterge">Șterge semnătura</button><button class="nu">Anulează</button><button class="ok">Salvează</button></div></div>';
  const nm = $('#mNume'), lc = $('#mLoc');
  if (vechi && vechi.solicitant) { nm.value = vechi.solicitant.nume || ''; lc.value = vechi.solicitant.localitate || ''; }
  else if (schita.nume && schita.nume !== 'Schiță fără nume') nm.value = schita.nume;   /* numele schiței se preia în mandat */
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const text = () => {
    const nume = esc(nm.value.trim().toUpperCase()) || '……………', loc = esc(lc.value.trim().toUpperCase());
    const sub = sex === 'F' ? 'Subsemnata' : 'Subsemnatul';
    $('#mText').innerHTML = '<p style="margin:0 0 8px"><b>MANDAT</b></p><p style="margin:0 0 8px">' + sub + ' <b>' + nume + '</b>' + (loc ? ' cu domiciliul în <b>' + loc + '</b>' : '') +
      ', în calitate de solicitant denumit în continuare mandant, împuternicesc prin prezenta pe d-nul <b>' + esc(mand.nume) + '</b> domiciliat în <b>' + esc(mand.localitate) + '</b>, din cadrul ' + esc(mand.firma) +
      ', denumit în continuare mandatar, pentru ca în numele meu și pentru mine să mă reprezinte cu puteri depline în fața SC Delgaz Grid SA (denumit în continuare OSD) în vederea racordării imobilului la sistemul de distribuție a gazelor naturale.</p>' +
      '<p style="margin:0 0 8px">În baza prezentului mandat, mandatarul meu se va prezenta la sediul OSD în vederea îndeplinirii tuturor formalităților necesare RACORDĂRII, va putea face cereri privind procesul de racordare, semnând în numele meu și pentru mine oriunde va fi necesar, în limitele prezentului mandat, semnătura sa fiindu-mi opozabilă.</p>' +
      '<p style="margin:0 0 8px;color:#555"><i>Drepturile și obligațiile părților, durata mandatului și celelalte clauze standard sunt în documentul final.</i></p>';
  };
  const marcheaza = () => {
    for (const [id, v] of [['mM', 'M'], ['mF', 'F']]) { $('#' + id).style.background = sex === v ? '#2f6fb0' : ''; $('#' + id).style.color = sex === v ? '#fff' : ''; }
    text();
  };
  $('#mM').onclick = () => { sex = 'M'; marcheaza(); };
  $('#mF').onclick = () => { sex = 'F'; marcheaza(); };
  nm.oninput = lc.oninput = text; marcheaza();
  m.hidden = false;
  /* câmpul de semnătură */
  const cs = $('#mSemn'), dpr0 = window.devicePixelRatio || 1;
  cs.width = Math.round(cs.clientWidth * dpr0); cs.height = Math.round(cs.clientHeight * dpr0);
  const g = cs.getContext('2d'); g.scale(dpr0, dpr0); g.lineWidth = 2.6; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#111';
  let ult = null;
  const loc2 = e => { const r = cs.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cs.onpointerdown = e => { e.preventDefault(); cs.setPointerCapture(e.pointerId); ult = loc2(e); g.beginPath(); g.moveTo(ult.x, ult.y); g.lineTo(ult.x + .1, ult.y + .1); g.stroke(); desenat = true; };
  cs.onpointermove = e => { if (!ult) return; const q = loc2(e); g.beginPath(); g.moveTo(ult.x, ult.y); g.lineTo(q.x, q.y); g.stroke(); ult = q; };
  cs.onpointerup = cs.onpointercancel = () => { ult = null; };
  $('#mSterge').onclick = () => { g.clearRect(0, 0, cs.clientWidth, cs.clientHeight); desenat = false; };
  m.querySelector('.nu').onclick = () => arataPoze();
  m.querySelector('.ok').onclick = async () => {
    if (!nm.value.trim()) { toast('Scrie numele'); return; }
    if (sex !== 'M' && sex !== 'F') { toast('Alege Domnul sau Doamna'); return; }
    if (!desenat) { toast('Lipsește semnătura'); return; }
    const d = new Date(), z = n => String(n).padStart(2, '0');
    const date = { solicitant: { nume: nm.value.trim().toUpperCase(), sex, localitate: lc.value.trim().toUpperCase() || null }, data_mandat: z(d.getDate()) + '.' + z(d.getMonth() + 1) + '.' + d.getFullYear() };
    const png = await new Promise(r => cs.toBlob(r, 'image/png'));
    await pozeAdauga({ id: schita.id + ':mandat', schita: schita.id, nume: 'mandat_date', ext: '.json', creat: acum(), blob: new Blob([JSON.stringify(date, null, 1)], { type: 'application/json' }) });
    await pozeAdauga({ id: schita.id + ':semnatura', schita: schita.id, nume: 'semnatura', ext: '.png', creat: acum(), blob: png });
    if (!schita.nume || schita.nume === 'Schiță fără nume') {   /* schița fără nume ia numele din mandat */
      schita.nume = date.solicitant.nume; $('#titlu').textContent = schita.nume; salveaza();
    }
    toast('Mandat salvat'); arataPoze();
  };
}

  const t = citesteToate();

  redimensioneaza();
  deschide(t[ultima] || Object.values(t)[0] || nouaSchita());

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
